name: Tests

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install "poetry==2.5.1"
      - name: Validate project and lock
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --with ai,ml,research --no-interaction --no-ansi
      - name: Build distributions
        run: poetry build
      - name: Run tests
        run: poetry run python -m pytest -q
