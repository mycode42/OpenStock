[Service]
ExecStart=
ExecStart=/usr/bin/node /opt/openstock/scripts/monitor.js
WorkingDirectory=/opt/openstock
TimeoutStartSec=55s
UMask=0077
RuntimeDirectory=openstock-monitor
Environment=MONITOR_LOCK_PATH=/run/openstock-monitor/monitor.lock
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/opt/openstock/database /opt/openstock/memory
