[project]
name = "algo-trader"
version = "3.1.1"
description = "Coordinated paper trading and research for equity and options strategies"
authors = [{ name = "Algo Trader maintainers" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
packages = [
    { include = "equity_research" },
    { include = "broker" },
    { include = "execution" },
    { include = "market" },
    { include = "options" },
    { include = "portfolio" },
    { include = "reporting" },
    { include = "runtime" },
    { include = "strategies" },
]
include = [
    { path = "scripts/build-extension.py", format = ["sdist", "wheel"] },
    { path = "strategies/llm_driven/analysis/api_models.json", format = ["sdist", "wheel"] },
    { path = "strategies/llm_driven/analysis/ollama_models.json", format = ["sdist", "wheel"] },
    { path = "options/config.default.json", format = ["sdist", "wheel"] },
    { path = "options/research/config.default.json", format = ["sdist", "wheel"] },
    { path = "options/_pricing_cy.pyx", format = "sdist" },
    { path = "options/_search_cy.pyx", format = "sdist" },
    { path = "options/*.so", format = "wheel" },
    { path = "options/*.pyd", format = "wheel" },
    { path = "strategies/multi_factor/_features_cy.pyx", format = "sdist" },
    { path = "strategies/multi_factor/*.so", format = "wheel" },
    { path = "strategies/multi_factor/*.pyd", format = "wheel" },
    { path = "equity_research/backtest/_execution_cy.pyx", format = "sdist" },
    { path = "equity_research/backtest/*.so", format = "wheel" },
    { path = "equity_research/backtest/*.pyd", format = "wheel" },
    { path = "strategies/_swing_common_cy.pyx", format = "sdist" },
    { path = "strategies/*.so", format = "wheel" },
    { path = "strategies/*.pyd", format = "wheel" },
]
exclude = [
    "strategies/multi_factor/_features_cy.pyx",
    "equity_research/backtest/_execution_cy.pyx",
    "strategies/_swing_common_cy.pyx",
    "options/_pricing_cy.pyx",
    "options/_search_cy.pyx",
]

[tool.poetry.dependencies]
pandas = "^2.1.0"
numpy = "^1.24.0"
python-dotenv = "^1.2.2"
requests = "^2.33.0"
pydantic = "^2.4.2"
certifi = "^2026.10.19"
duckdb = "^2.0.0"

[tool.poetry.group.ai]
optional = true

[tool.poetry.group.ai.dependencies]
langchain = "^1.3.9"
langchain-anthropic = "^1.4.6"
langchain-groq = "^1.1.3"
langchain-openai = "^1.1.14"
langchain-deepseek = "^1.1.1"
langchain-ollama = "^1.1.0"
langchain-google-genai = "^4.4.2"
langchain-gigachat = "^0.5.1"
langchain-xai = "^1.3.0"
langgraph = "^1.0.10"
rich = "^13.9.4"

[tool.poetry.group.research]
optional = true

[tool.poetry.group.research.dependencies]
yfinance = "^1.2.0"

[tool.poetry.group.theta]
optional = true

[tool.poetry.group.theta.dependencies]
thetadata = { version = "^1.0.15", python = ">=3.12" }

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
scikit-learn = "^1.9.1"
hmmlearn = "^0.3.3"
lightgbm = "^4.6.0"
xgboost-cpu = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.3.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
cython = ">=3.0.11,<4.0.0"
setuptools = ">=84.1,<85"

[tool.poetry.build]
script = "scripts/build-extension.py"

[build-system]
requires = ["poetry-core", "cython>=3.0.11,<4.0.0", "setuptools>=84.1,<85"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true
