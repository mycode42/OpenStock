[project]
name = "algo-trader"
version = "2.0.0"
description = "Paper-trading strategy portfolios and research tools"
authors = [{ name = "Algo Trader maintainers" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [
    { include = "autoresearch" },
    { include = "broker" },
    { include = "execution" },
    { include = "market" },
    { include = "portfolio" },
    { include = "reporting" },
    { include = "runtime" },
    { include = "strategies" },
]
include = [
    { path = "scripts/build-extension.py", format = ["sdist", "wheel"] },
    { path = "strategies/event_driven/analysis/api_models.json", format = ["sdist", "wheel"] },
    { path = "strategies/event_driven/analysis/ollama_models.json", format = ["sdist", "wheel"] },
    { path = "strategies/multi_factor/_features_cy.pyx", format = "sdist" },
    { path = "strategies/multi_factor/*.so", format = "wheel" },
    { path = "strategies/multi_factor/*.pyd", format = "wheel" },
    { path = "autoresearch/backtest/_execution_cy.pyx", format = "sdist" },
    { path = "autoresearch/backtest/*.so", format = "wheel" },
    { path = "autoresearch/backtest/*.pyd", format = "wheel" },
    { path = "strategies/_swing_common_cy.pyx", format = "sdist" },
    { path = "strategies/*.so", format = "wheel" },
    { path = "strategies/*.pyd", format = "wheel" },
]
exclude = [
    "strategies/multi_factor/_features_cy.pyx",
    "autoresearch/backtest/_execution_cy.pyx",
    "strategies/_swing_common_cy.pyx",
]

[tool.poetry.dependencies]
langchain = "^1.3.9"
langchain-anthropic = "^1.4.6"
langchain-groq = "^1.1.3"
langchain-openai = "^1.1.14"
langchain-deepseek = "^1.1.1"
langchain-ollama = "^1.1.0"
langgraph = "^1.0.10"
pandas = "^2.1.0"
numpy = "^1.24.0"
python-dotenv = "^1.2.2"
requests = "^2.33.0"
matplotlib = "^3.9.2"
tabulate = "^0.9.0"
colorama = "^0.4.6"
questionary = "^2.1.0"
rich = "^13.9.4"
langchain-google-genai = "^4.4.2"
pydantic = "^2.4.2"
langchain-gigachat = "^0.5.1"
langchain-xai = "^1.3.0"
yfinance = "^1.2.0"
scikit-learn = "^1.9.1"
hmmlearn = "^0.3.3"
lightgbm = "^4.6.0"
xgboost-cpu = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.3.1"
isort = "^5.12.0"
flake8 = "^6.1.0"
cython = ">=3.0.11,<4.0.0"
setuptools = ">=83,<84"

[tool.poetry.build]
script = "scripts/build-extension.py"

[build-system]
requires = ["poetry-core", "cython>=3.0.11,<4.0.0", "setuptools>=83,<84"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true
