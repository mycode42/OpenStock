[project]
name = "swarm-trader"
version = "2.0.0"
description = "Paper-trading strategy portfolios and research tools"
authors = [{ name = "Swarm Trader maintainers" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{ include = "src", from = "." }]
include = [
    { path = "risk_manager.py", format = ["sdist", "wheel"] },
    { path = "scripts/build-extension.py", format = ["sdist", "wheel"] },
    { path = "src/algo/strategies/multi_factor/_features_cy.pyx", format = "sdist" },
    { path = "src/algo/strategies/multi_factor/*.so", format = "wheel" },
    { path = "src/algo/strategies/multi_factor/*.pyd", format = "wheel" },
    { path = "src/algo/backtest/_execution_cy.pyx", format = "sdist" },
    { path = "src/algo/backtest/*.so", format = "wheel" },
    { path = "src/algo/backtest/*.pyd", format = "wheel" },
    { path = "src/algo/strategies/_swing_common_cy.pyx", format = "sdist" },
    { path = "src/algo/strategies/*.so", format = "wheel" },
    { path = "src/algo/strategies/*.pyd", format = "wheel" },
]
exclude = [
    "src/algo/strategies/multi_factor/_features_cy.pyx",
    "src/algo/backtest/_execution_cy.pyx",
    "src/algo/strategies/_swing_common_cy.pyx",
]

[tool.poetry.dependencies]
langchain = "^0.3.7"
langchain-anthropic = "0.3.5"
langchain-groq = "0.2.3"
langchain-openai = "^0.3.5"
langchain-deepseek = "^0.1.2"
langchain-ollama = "0.3.6"
langgraph = "0.2.56"
pandas = "^2.1.0"
numpy = "^1.24.0"
python-dotenv = "1.0.0"
requests = "^2.32.5"
matplotlib = "^3.9.2"
tabulate = "^0.9.0"
colorama = "^0.4.6"
questionary = "^2.1.0"
rich = "^13.9.4"
langchain-google-genai = "^2.0.11"
pydantic = "^2.4.2"
langchain-gigachat = "^0.3.12"
langchain-xai = "^0.2.5"
yfinance = "^1.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
cython = ">=3.0.11,<4.0.0"
setuptools = ">=74,<82"

[tool.poetry.build]
script = "scripts/build-extension.py"

[build-system]
requires = ["poetry-core", "cython>=3.0.11,<4.0.0", "setuptools>=74,<82"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 420
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true

[project.scripts]
backtester = "src.backtesting.cli:main"
