<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OpenStock">
<title>OpenStock - Trading Dashboard</title>
<link rel="icon" type="image/png" sizes="32x32" href="/stock-monitor/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/stock-monitor/favicon-16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/stock-monitor/favicon-48.png">
<link rel="icon" type="image/png" sizes="64x64" href="/stock-monitor/favicon-64.png">
<link rel="icon" type="image/png" sizes="128x128" href="/stock-monitor/favicon-128.png">
<link rel="icon" type="image/png" sizes="192x192" href="/stock-monitor/favicon-192.png">
<link rel="icon" type="image/png" sizes="256x256" href="/stock-monitor/favicon-256.png">
<link rel="apple-touch-icon" sizes="180x180" href="/stock-monitor/apple-touch-icon.png">
<link rel="stylesheet" href="/stock-monitor/styles.css">
<meta name="theme-color" content="#000000">
</head>
<body>
<nav>
<a href="#/dashboard" class="active" data-page="dashboard">Dashboard</a>
<a href="#/config" data-page="config">Configure</a>
<a href="#/journal" data-page="journal">Journal</a>
</nav>
<div class="container">
<div id="page-dashboard"></div>
<div id="page-config" class="hidden"></div>
<div id="page-journal" class="hidden"></div>
</div>
<script src="./app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then((registration) => {
        console.log('ServiceWorker registration successful with scope: ', registration.scope);
      })
      .catch((error) => {
        console.log('ServiceWorker registration failed: ', error);
      });
  });
}
</script>
</body>
</html>
